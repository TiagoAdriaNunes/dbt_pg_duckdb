name: dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed by peaceiris/actions-gh-pages to push gh-pages branch

jobs:
  docs:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgduckdb/pgduckdb:18-v1.1.1
        env:
          POSTGRES_PASSWORD: duckdb
          POSTGRES_DB: analytics
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Create pg_duckdb extension
        run: psql -h localhost -U postgres -d analytics -c "CREATE EXTENSION IF NOT EXISTS pg_duckdb;"
        env:
          PGPASSWORD: duckdb

      - name: Load TPC-H data
        run: uv run python scripts/init_tpch.py
        env:
          TPCH_SCALE_FACTOR: "0.1"

      - name: dbt deps
        run: cd dbt && uv run dbt deps --profiles-dir .

      - name: dbt run
        run: cd dbt && uv run dbt run --profiles-dir .

      - name: dbt docs generate
        run: cd dbt && uv run dbt docs generate --profiles-dir .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dbt/target
