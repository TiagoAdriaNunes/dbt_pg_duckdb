[project]
name = "dbt-pg-duckdb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.9",
    "duckdb>=1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "sqlfluff>=3.0",
    "sqlfluff-templater-dbt>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
