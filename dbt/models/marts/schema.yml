version: 2

models:
  - name: orders_summary
    description: "Per-customer completed order aggregates"
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - unique
      - name: order_count
        data_type: bigint
        constraints:
          - type: not_null
      - name: total_amount
        data_type: numeric
        constraints:
          - type: not_null
      - name: first_order_date
        data_type: date
        constraints:
          - type: not_null
      - name: last_order_date
        data_type: date
        constraints:
          - type: not_null
