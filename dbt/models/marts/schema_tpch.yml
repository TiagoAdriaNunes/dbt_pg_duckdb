version: 2

models:
  - name: tpch_revenue_by_segment
    description: "Revenue, order count, and customer count aggregated by market segment"
    config:
      contract:
        enforced: true
    columns:
      - name: market_segment
        data_type: text
        tests: [unique, not_null]
      - name: revenue
        data_type: double precision
        tests: [not_null]
      - name: order_count
        data_type: bigint
        tests: [not_null]
      - name: customer_count
        data_type: bigint
        tests: [not_null]

  - name: tpch_daily_revenue
    description: "Incremental daily revenue rollup from lineitems, keyed on ship_date. New dates are appended on each run."
    config:
      contract:
        enforced: true
    columns:
      - name: ship_date
        data_type: date
        tests: [unique, not_null]
      - name: line_count
        data_type: bigint
        tests: [not_null]
      - name: order_count
        data_type: bigint
        tests: [not_null]
      - name: total_quantity
        data_type: double precision
        tests: [not_null]
      - name: revenue
        data_type: double precision
        tests: [not_null]
      - name: revenue_after_tax
        data_type: double precision
        tests: [not_null]
      - name: avg_discount
        data_type: double precision
        tests: [not_null]

  - name: tpch_supplier_performance
    description: "Revenue and discount stats per supplier with nation and region context"
    config:
      contract:
        enforced: true
    columns:
      - name: supplier_key
        data_type: bigint
        tests: [unique, not_null]
      - name: supplier_name
        data_type: text
        tests: [not_null]
      - name: nation_name
        data_type: text
        tests: [not_null]
      - name: region_name
        data_type: text
        tests: [not_null]
      - name: revenue
        data_type: double precision
        tests: [not_null]
      - name: order_count
        data_type: bigint
        tests: [not_null]
      - name: avg_discount
        data_type: numeric(18,4)
        tests: [not_null]

  - name: tpch_q1_pricing_summary
    description: "TPC-H Q1 — pricing summary report aggregated by return flag and line status"
    config:
      contract:
        enforced: true
    columns:
      - name: return_flag
        data_type: text
        tests: [not_null]
      - name: line_status
        data_type: text
        tests: [not_null]
      - name: sum_qty
        data_type: double precision
        tests: [not_null]
      - name: sum_base_price
        data_type: double precision
        tests: [not_null]
      - name: sum_disc_price
        data_type: double precision
        tests: [not_null]
      - name: sum_charge
        data_type: double precision
        tests: [not_null]
      - name: avg_qty
        data_type: double precision
        tests: [not_null]
      - name: avg_price
        data_type: double precision
        tests: [not_null]
      - name: avg_disc
        data_type: double precision
        tests: [not_null]
      - name: count_order
        data_type: bigint
        tests: [not_null]

  - name: tpch_q3_shipping_priority
    description: "TPC-H Q3 — top 10 unshipped orders with highest revenue for BUILDING segment"
    config:
      contract:
        enforced: true
    columns:
      - name: order_key
        data_type: bigint
        tests: [not_null]
      - name: revenue
        data_type: double precision
        tests: [not_null]
      - name: order_date
        data_type: date
        tests: [not_null]
      - name: ship_priority
        data_type: bigint
        tests: [not_null]

  - name: tpch_q5_local_supplier_volume
    description: "TPC-H Q5 — revenue by nation for suppliers in the ASIA region (1994)"
    config:
      contract:
        enforced: true
    columns:
      - name: nation_name
        data_type: text
        tests: [unique, not_null]
      - name: revenue
        data_type: double precision
        tests: [not_null]
