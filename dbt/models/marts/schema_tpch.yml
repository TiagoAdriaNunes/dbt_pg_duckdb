version: 2

models:
  - name: tpch_revenue_by_segment
    description: "Revenue, order count, and customer count aggregated by market segment"
    config:
      contract:
        enforced: true
    columns:
      - name: market_segment
        data_type: text
        constraints: [{type: not_null}]
        tests: [unique]
      - name: revenue
        data_type: double precision
        constraints: [{type: not_null}]
      - name: order_count
        data_type: bigint
        constraints: [{type: not_null}]
      - name: customer_count
        data_type: bigint
        constraints: [{type: not_null}]

  - name: tpch_supplier_performance
    description: "Revenue and discount stats per supplier with nation and region context"
    config:
      contract:
        enforced: true
    columns:
      - name: supplier_key
        data_type: bigint
        constraints: [{type: not_null}]
        tests: [unique]
      - name: supplier_name
        data_type: text
        constraints: [{type: not_null}]
      - name: nation_name
        data_type: text
        constraints: [{type: not_null}]
      - name: region_name
        data_type: text
        constraints: [{type: not_null}]
      - name: revenue
        data_type: double precision
        constraints: [{type: not_null}]
      - name: order_count
        data_type: bigint
        constraints: [{type: not_null}]
      - name: avg_discount
        data_type: numeric
        constraints: [{type: not_null}]
