version: 2

models:
  - name: stg_tpch_orders
    description: "Cleaned TPC-H orders with renamed columns"
    config:
      contract:
        enforced: true
    columns:
      - name: order_key
        data_type: bigint
        constraints: [{type: not_null}]
        tests: [unique]
      - name: customer_key
        data_type: bigint
        constraints: [{type: not_null}]
      - name: status
        data_type: text
        constraints: [{type: not_null}]
      - name: total_price
        data_type: double precision
        constraints: [{type: not_null}]
      - name: order_date
        data_type: date
        constraints: [{type: not_null}]
      - name: priority
        data_type: text
        constraints: [{type: not_null}]
      - name: clerk
        data_type: text
        constraints: [{type: not_null}]
      - name: ship_priority
        data_type: bigint
        constraints: [{type: not_null}]

