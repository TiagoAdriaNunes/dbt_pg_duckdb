version: 2

models:
  - name: stg_orders
    description: "Cleaned TPC-H orders with renamed columns"
    config:
      contract:
        enforced: true
    columns:
      - name: order_key
        data_type: bigint
        tests: [unique, not_null]
      - name: customer_key
        data_type: bigint
        tests: [not_null]
      - name: status
        data_type: text
      - name: total_price
        data_type: numeric
      - name: order_date
        data_type: date
        tests: [not_null]
      - name: priority
        data_type: text
      - name: clerk
        data_type: text
      - name: ship_priority
        data_type: bigint

  - name: stg_lineitems
    description: "Cleaned TPC-H line items with renamed columns"
    config:
      contract:
        enforced: true
    columns:
      - name: order_key
        data_type: bigint
        tests: [not_null]
      - name: part_key
        data_type: bigint
        tests: [not_null]
      - name: supplier_key
        data_type: bigint
        tests: [not_null]
      - name: line_number
        data_type: bigint
      - name: quantity
        data_type: numeric
      - name: extended_price
        data_type: numeric
        tests: [not_null]
      - name: discount
        data_type: numeric
        tests: [not_null]
      - name: tax
        data_type: numeric
      - name: return_flag
        data_type: text
      - name: line_status
        data_type: text
      - name: ship_date
        data_type: date
        tests: [not_null]
      - name: commit_date
        data_type: date
      - name: receipt_date
        data_type: date
      - name: ship_instruct
        data_type: text
      - name: ship_mode
        data_type: text

  - name: stg_customers
    description: "Cleaned TPC-H customers with renamed columns"
    config:
      contract:
        enforced: true
    columns:
      - name: customer_key
        data_type: bigint
        tests: [unique, not_null]
      - name: name
        data_type: text
        tests: [not_null]
      - name: address
        data_type: text
      - name: nation_key
        data_type: bigint
        tests: [not_null]
      - name: phone
        data_type: text
      - name: account_balance
        data_type: numeric
      - name: market_segment
        data_type: text
        tests: [not_null]

  - name: stg_suppliers
    description: "Cleaned TPC-H suppliers with renamed columns"
    config:
      contract:
        enforced: true
    columns:
      - name: supplier_key
        data_type: bigint
        tests: [unique, not_null]
      - name: name
        data_type: text
        tests: [not_null]
      - name: address
        data_type: text
      - name: nation_key
        data_type: bigint
        tests: [not_null]
      - name: phone
        data_type: text
      - name: account_balance
        data_type: numeric

  - name: stg_nations
    description: "Cleaned TPC-H nations with renamed columns"
    config:
      contract:
        enforced: true
    columns:
      - name: nation_key
        data_type: bigint
        tests: [unique, not_null]
      - name: name
        data_type: text
        tests: [not_null]
      - name: region_key
        data_type: bigint
        tests: [not_null]

  - name: stg_regions
    description: "Cleaned TPC-H regions with renamed columns"
    config:
      contract:
        enforced: true
    columns:
      - name: region_key
        data_type: bigint
        tests: [unique, not_null]
      - name: name
        data_type: text
        tests: [not_null]
