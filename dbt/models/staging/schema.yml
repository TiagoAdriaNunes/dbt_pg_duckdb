version: 2

models:
  - name: stg_orders
    description: "Cleaned and filtered orders from raw seed data"
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        description: "Primary key"
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - unique
      - name: customer_id
        data_type: bigint
        constraints:
          - type: not_null
      - name: amount
        data_type: numeric
        constraints:
          - type: not_null
      - name: status
        data_type: text
        constraints:
          - type: not_null
        tests:
          - accepted_values:
              arguments:
                values: ["completed", "pending"]
      - name: created_at
        data_type: date
        constraints:
          - type: not_null
