version: 2

models:
  - name: stg_orders
    description: "Cleaned and filtered orders from raw seed data"
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        description: "Primary key"
        data_type: bigint
        tests: [unique, not_null]
      - name: customer_id
        data_type: bigint
        tests: [not_null]
      - name: amount
        data_type: numeric(10,2)
        tests: [not_null]
      - name: status
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["completed", "pending"]
      - name: created_at
        data_type: date
        tests: [not_null]
