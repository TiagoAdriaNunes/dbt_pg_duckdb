services:
  db:
    image: pgduckdb/pgduckdb:18-v1.1.1
    command: "postgres -c max_wal_size=4GB -c shared_buffers=512MB -c work_mem=256MB -c max_parallel_workers_per_gather=4"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duckdb}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    shm_size: '1g'
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbt:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duckdb}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      DBT_TARGET: ${DBT_TARGET:-dev}
    volumes:
      - ./dbt:/app/dbt
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/dbt

volumes:
  pgdata:
